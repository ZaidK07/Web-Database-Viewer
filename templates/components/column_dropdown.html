<!-- Column Visibility & Reordering Toolbar Dropdown -->
<div class="relative" id="column-visibility-menu">
    <!-- Click-Outside Backdrop -->
    <div v-if="showColumnDropdown" class="fixed inset-0 z-30" @click="showColumnDropdown = false"></div>

    <button @click="showColumnDropdown = !showColumnDropdown"
            :class="hiddenCount > 0 
                ? 'bg-brand-50 dark:bg-brand-950/40 border-brand-300 dark:border-brand-700 text-brand-700 dark:text-brand-300 font-semibold' 
                : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 font-medium'"
            class="h-9 px-3 rounded-lg border text-sm transition-all shadow-sm flex items-center gap-1.5 shrink-0 relative z-40"
            title="Configure visible columns and ordering">
        <i class="ph-bold ph-columns text-base"></i>
        <span>Columns</span>
        <span v-if="hiddenCount > 0" 
              class="ml-0.5 px-1.5 py-0.5 rounded-full text-[10px] bg-brand-500 text-white font-bold leading-none">
            {% raw %}{{ visibleCount }}/{{ totalCount }}{% endraw %}
        </span>
        <i class="ph-bold ph-caret-down text-xs text-slate-400 transition-transform duration-200"
           :class="{'rotate-180': showColumnDropdown}"></i>
    </button>

    <!-- Dropdown Panel -->
    <div v-if="showColumnDropdown" 
         class="absolute right-0 mt-1.5 w-80 bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 z-40 overflow-hidden animate-in fade-in zoom-in-95 duration-150 flex flex-col">
        <!-- Header -->
        <div class="px-3.5 py-2.5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/80 dark:bg-slate-800/50">
            <div class="flex items-center gap-1.5">
                <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Columns</span>
                <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">
                    ({% raw %}{{ visibleCount }}{% endraw %} of {% raw %}{{ totalCount }}{% endraw %})
                </span>
            </div>
            <button @click="showColumnDropdown = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-0.5 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800">
                <i class="ph-bold ph-x text-sm"></i>
            </button>
        </div>

        <!-- Search Bar -->
        <div class="p-2 border-b border-slate-100 dark:border-slate-800">
            <div class="relative">
                <i class="ph ph-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input v-model="columnSearch" type="text" placeholder="Filter columns..." 
                       class="w-full h-8 pl-8 pr-7 bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 text-xs rounded-lg focus:outline-none focus:ring-1 focus:ring-brand-500 placeholder:text-slate-400" />
                <button v-if="columnSearch" @click="columnSearch = ''" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">
                    <i class="ph ph-x"></i>
                </button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="px-3 py-1.5 bg-slate-50/50 dark:bg-slate-800/30 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between text-[11px]">
            <div class="flex items-center gap-2">
                <button type="button" @click="showAllColumns" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">Show All</button>
                <span class="text-slate-300 dark:text-slate-700">•</span>
                <button type="button" @click="hideAllColumns" class="text-slate-600 dark:text-slate-400 hover:underline font-medium">Only PKs</button>
            </div>
            <button type="button" @click="resetColumns" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:underline">Reset</button>
        </div>

        <!-- Column Items List -->
        <div class="max-h-64 overflow-y-auto p-1.5 flex flex-col gap-0.5 divide-y divide-slate-50 dark:divide-slate-800/50">
            <div v-for="(col, index) in filteredColumnList" :key="col.Field"
                 draggable="true"
                 @dragstart="onColDragStart($event, col.Field)"
                 @dragover.prevent="onColDragOver($event, col.Field)"
                 @drop="onColDrop($event, col.Field)"
                 @dragend="onColDragEnd"
                 class="group flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors text-xs select-none"
                 :class="{'opacity-50': isColDragging && draggedColField === col.Field}">
                <!-- Checkbox & Label -->
                <label class="flex items-center gap-2 min-w-0 cursor-pointer flex-1 mr-2">
                    <input type="checkbox"
                           :checked="isColumnVisible(col.Field)"
                           @change="toggleColumn(col.Field)"
                           class="w-3.5 h-3.5 rounded border-slate-300 dark:border-slate-700 text-brand-600 focus:ring-brand-500 dark:bg-slate-800 cursor-pointer shrink-0" />
                    <span class="truncate font-medium" 
                          :class="isColumnVisible(col.Field) ? 'text-slate-800 dark:text-slate-200' : 'text-slate-400 dark:text-slate-500 line-through'">
                        {% raw %}{{ col.Field }}{% endraw %}
                    </span>
                    <span v-if="col.Key === 'PRI' || isColumnPrimaryKey(col.Field)" 
                          class="px-1 py-0.2 rounded text-[9px] font-bold bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 shrink-0">PK</span>
                    <span v-if="col.Type" class="text-[10px] text-slate-400 font-mono truncate shrink-0 max-w-[80px]">{% raw %}{{ col.Type }}{% endraw %}</span>
                </label>

                <!-- Reorder Controls -->
                <div class="flex items-center gap-0.5 opacity-40 group-hover:opacity-100 transition-opacity shrink-0">
                    <button type="button" @click="moveColumnUp(col.Field)" :disabled="index === 0"
                            class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 disabled:opacity-20 disabled:hover:bg-transparent" title="Move Left / Earlier">
                        <i class="ph-bold ph-caret-up text-xs"></i>
                    </button>
                    <button type="button" @click="moveColumnDown(col.Field)" :disabled="index === filteredColumnList.length - 1"
                            class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 disabled:opacity-20 disabled:hover:bg-transparent" title="Move Right / Later">
                        <i class="ph-bold ph-caret-down text-xs"></i>
                    </button>
                    <div class="cursor-grab active:cursor-grabbing p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" title="Drag to reorder">
                        <i class="ph-bold ph-dots-six-vertical text-xs"></i>
                    </div>
                </div>
            </div>

            <div v-if="filteredColumnList.length === 0" class="py-6 text-center text-xs text-slate-400 italic">
                No matching columns
            </div>
        </div>

        <!-- Footer Notice -->
        <div class="px-3 py-1.5 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30 flex items-center justify-between text-[10px] text-slate-400">
            <span>Drag or use arrows to reorder</span>
            <span class="font-mono">Saved per table</span>
        </div>
    </div>
</div>
